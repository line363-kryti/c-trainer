<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — C-тренажёр</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); } catch {}</script>
  <style>
    .auth { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(360px, 0.9fr); min-height: 100vh; }
    .auth-art { position: relative; overflow: hidden; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; }
    .auth-art .ribbon { position: absolute; width: 640px; left: 50%; top: 50%; transform: translate(-30%, -46%); pointer-events: none; }
    .auth-art .ribbon path { animation: draw 1.4s cubic-bezier(.6, 0, .2, 1) both .1s; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    .auth-art h1 { position: relative; font-size: clamp(34px, 4.4vw, 60px); line-height: 1.05; max-width: 9em; }
    .auth-art .brand { position: relative; padding: 0; }
    .auth-form-wrap { display: grid; place-items: center; padding: 32px 24px; background: var(--bg-raised); border-left: 1px solid var(--line); }
    .auth-form { width: min(380px, 100%); display: grid; gap: 18px; }
    .auth-form h2 { font-size: 26px; }
    .auth-form p { margin: 0; color: var(--text-2); }
    .field { display: grid; gap: 6px; font-size: 14px; color: var(--text-2); }
    .field input {
      font: 16px var(--font-text); color: var(--text);
      padding: 12px 14px; border-radius: var(--radius-s);
      background: var(--bg); border: 1px solid var(--line-strong);
    }
    .field input:focus { outline: none; border-color: var(--lime); box-shadow: 0 0 0 3px var(--lime-soft); }
    .actions { display: grid; gap: 10px; margin-top: 4px; }
    .actions .btn { justify-content: center; }
    .error { min-height: 1.5em; color: var(--danger); font-size: 14px; }
    @media (max-width: 860px) {
      .auth { grid-template-columns: 1fr; }
      .auth-art { min-height: 300px; padding: 24px 16px; }
      .auth-art .ribbon { width: 380px; transform: translate(-10%, -50%); }
      .auth-form-wrap { border-left: 0; border-top: 1px solid var(--line); align-items: start; }
    }
  </style>
</head>
<body>
  <div class="auth">
    <section class="auth-art">
      <svg class="ribbon" viewBox="0 0 600 600" aria-hidden="true">
        <path d="M455.6 144.4A220 220 0 1 0 455.6 455.6" pathLength="1" stroke-dasharray="1"
              fill="none" stroke="var(--lime)" stroke-width="118" stroke-linecap="round"/>
      </svg>
      <a class="brand" href="/" aria-label="C-тренажёр">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M23.8 8.2A11 11 0 1 0 23.8 23.8" fill="none" stroke="var(--lime)" stroke-width="6.5" stroke-linecap="round"/></svg>
        <span class="brand-name">C-тренажёр</span>
      </a>
      <h1>Уроки по C и задачи с автопроверкой</h1>
    </section>

    <section class="auth-form-wrap">
      <form class="auth-form" id="form" novalidate>
        <h2>Вход</h2>
        <p>Прогресс и твой код хранятся в аккаунте.</p>
        <label class="field">Email
          <input name="email" type="email" required autocomplete="email" placeholder="name@example.com">
        </label>
        <label class="field">Пароль
          <input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="Не короче 8 символов">
        </label>
        <div class="actions">
          <button class="btn btn-primary" type="submit" data-action="login">Войти</button>
          <button class="btn btn-outline" type="submit" data-action="register">Создать аккаунт</button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>
  </div>

  <script type="module">
    import { api } from "/js/api.js";

    const form = document.getElementById("form");
    const error = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = e.submitter;
      const body = Object.fromEntries(new FormData(form));
      if (!body.email || !body.password) {
        error.textContent = "Введи email и пароль.";
        return;
      }
      error.textContent = "";
      button.setAttribute("aria-busy", "true");
      try {
        await api(`/api/auth/${button.dataset.action}`, { method: "POST", body });
        // Возвращаемся туда, откуда отправили на вход. Только адреса нашего сайта: «/…», но не «//чужой-сайт»
        const next = new URLSearchParams(location.search).get("next") || "/";
        location.href = next.startsWith("/") && !next.startsWith("//") ? next : "/";
      } catch (err) {
        error.textContent = err.message;
      } finally {
        button.removeAttribute("aria-busy");
      }
    });
  </script>
</body>
</html>
